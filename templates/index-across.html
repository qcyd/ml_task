<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>原型网络 · 小样本学习 | 训练监控与预测</title>
    <!-- Chart.js 与 Font Awesome -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #f5f9ff;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .dashboard {
            max-width: 1400px;
            width: 100%;
        }
        h1 {
            font-weight: 600;
            font-size: 2.2rem;
            color: #0b1e33;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 i {
            color: #3b82f6;
            font-size: 2rem;
        }
        .subtitle {
            color: #475569;
            margin-bottom: 28px;
            border-left: 5px solid #3b82f6;
            padding-left: 18px;
            font-weight: 400;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 24px;
            margin-bottom: 30px;
        }
        .card {
            background: #ffffffdd;
            backdrop-filter: blur(8px);
            background: #fff;
            border-radius: 28px;
            padding: 24px 26px;
            box-shadow: 0 20px 35px -8px rgba(0,27,58,0.08), 0 6px 12px rgba(0,0,0,0.02);
            border: 1px solid #eef3f8;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
        }
        .badge {
            background: #e6edf6;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1e4b7a;
            font-weight: 500;
        }
        .param-row {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 24px;
            margin: 20px 0 16px;
        }
        .param-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .param-item label {
            font-weight: 600;
            color: #334155;
        }
        .param-item input {
            width: 90px;
            padding: 8px 12px;
            border: 1.5px solid #d1dce8;
            border-radius: 24px;
            font-weight: 500;
            text-align: center;
            background: white;
            transition: 0.2s;
        }
        .param-item input:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px #bfdbfe;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0 8px;
        }
        .btn {
            background: white;
            border: 1.5px solid #cbd5e1;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
            box-shadow: 0 10px 18px -8px #3b82f6b0;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .btn-outline-blue {
            border-color: #93c5fd;
            background: #eff6ff;
            color: #1e4b7a;
        }
        .btn-outline-blue:hover {
            background: #dbeafe;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .status-panel {
            background: #fafcff;
            border-radius: 24px;
            padding: 18px 20px;
            margin: 20px 0 12px;
            border-left: 6px solid #3b82f6;
            border: 1px solid #e2ebf3;
        }
        .progress-container {
            margin: 16px 0 10px;
        }
        .progress-bar-bg {
            height: 12px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .metric-highlight {
            display: flex;
            justify-content: space-around;
            margin: 18px 0 8px;
        }
        .metric-card {
            text-align: center;
            background: white;
            padding: 12px 18px;
            border-radius: 28px;
            box-shadow: 0 4px 12px #e2e8f0;
            min-width: 110px;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
        }
        .metric-label {
            color: #64748b;
            font-size: 0.9rem;
        }
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .chart-box {
            background: #fbfdff;
            border-radius: 20px;
            padding: 10px;
        }
        canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 200px;
        }

        /* 预测区域 */
        .upload-section {
            margin: 18px 0;
        }
        .section-title {
            font-weight: 600;
            margin: 16px 0 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .image-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0 16px;
            min-height: 80px;
            background: #fafdff;
            border-radius: 24px;
            padding: 14px;
            border: 1.5px dashed #b9cde0;
        }
        .thumb-wrapper {
            position: relative;
            width: 85px;
            height: 85px;
        }
        .thumb {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid white;
            box-shadow: 0 8px 14px rgba(0,0,0,0.05);
            background: #eef2f6;
        }
        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 30px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(239,68,68,0.3);
            font-size: 14px;
            transition: 0.15s;
        }
        .delete-btn:hover {
            background: #b91c1c;
            transform: scale(1.05);
        }
        .file-count-badge {
            background: #e2e8f0;
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 0.9rem;
            margin-left: 8px;
        }
        .prediction-result {
            background: #eef4ff;
            border-radius: 24px;
            padding: 20px;
            margin-top: 24px;
        }
        .prob-item {
            margin-bottom: 12px;
        }
        .prob-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }
        .prob-bar-bg {
            height: 10px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }
        .prob-bar-fill {
            height: 100%;
            background: #2563eb;
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s;
        }
        .message-bar {
            margin-top: 18px;
            padding: 12px 18px;
            border-radius: 40px;
            background: #f1f5f9;
            color: #1e293b;
        }
        .footer-note {
            text-align: center;
            margin-top: 30px;
            color: #62748c;
            font-size: 0.9rem;
        }
        @media (max-width: 900px) {
            .grid-2col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <h1>
        <i class="fas fa-microchip"></i>
        ProtoNet · 小样本学习
        <span style="font-size: 1rem; margin-left: auto; background: #e6f0ff; padding: 6px 20px; border-radius: 40px;">
            <i class="fas fa-server"></i> <span id="device-indicator">检测中...</span>
        </span>
    </h1>
    <div class="subtitle">N-way K-shot 原型网络 </div>

    <div class="grid-2col">
        <!-- 左侧：训练控制 + 图表 -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-sliders-h"></i> 训练中心</h2>
                <span class="badge" id="model-status-badge">未加载</span>
            </div>
            <div class="param-row">
                <div class="param-item">
                    <label><i class="fas fa-layer-group"></i> N-way</label>
                    <input type="number" id="nWayInput" min="2" max="20" value="5">
                </div>
                <div class="param-item">
                    <label><i class="fas fa-camera"></i> K-shot</label>
                    <input type="number" id="kShotInput" min="1" max="10" value="1">
                </div>
                <div class="param-item">
                    <label><i class="fas fa-redo-alt"></i> Epochs</label>
                    <input type="number" id="epochsInput" min="1" max="50" value="10">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="startTrainBtn"><i class="fas fa-play"></i> 开始训练</button>
                <button class="btn btn-outline-blue" id="loadModelBtn"><i class="fas fa-folder-open"></i> 加载模型</button>
                <button class="btn" id="resetSystemBtn"><i class="fas fa-sync-alt"></i> 重置</button>
                <button class="btn" id="stopPollingBtn" disabled><i class="fas fa-pause"></i> 停止刷新</button>
            </div>

            <!-- 实时状态 -->
            <div class="status-panel">
                <div style="display: flex; justify-content: space-between;">
                    <span><i class="fas fa-info-circle"></i> <span id="trainingMessage">就绪，等待指令</span></span>
                    <span><strong id="epochDisplay">0/0</strong></span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div class="progress-fill" id="epochProgress" style="width:0%"></div>
                    </div>
                </div>
                <div class="metric-highlight">
                    <div class="metric-card">
                        <div class="metric-value" id="trainLossVal">-</div>
                        <div class="metric-label">训练损失</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="trainAccVal">-</div>
                        <div class="metric-label">训练准确率</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="valAccVal">-</div>
                        <div class="metric-label">验证准确率</div>
                    </div>
                </div>
            </div>

            <!-- 图表 -->
            <div class="charts-row">
                <div class="chart-box">
                    <canvas id="lossChart"></canvas>
                    <div style="text-align:center; font-weight:500; margin-top:6px;">📉 损失曲线</div>
                </div>
                <div class="chart-box">
                    <canvas id="accChart"></canvas>
                    <div style="text-align:center; font-weight:500; margin-top:6px;">📈 准确率曲线</div>
                </div>
            </div>
            <div style="font-size:0.85rem; margin-top:8px; color:#64748b;">
                <i class="far fa-clock"></i> 状态自动刷新 (训练中每秒更新)
            </div>
        </div>

        <!-- 右侧：预测演示 -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-flask"></i> 小样本预测</h2>
                <span class="badge" id="supportHint">需 5 张支持图像</span>
            </div>
            <div class="upload-section">
                <!-- 支持集区域 -->
                <div class="section-title">
                    <i class="fas fa-layer-group"></i> 支持集
                    <span class="file-count-badge" id="supportCountDisplay">0 张</span>
                </div>
                <div style="display: flex; gap: 8px; margin-bottom: 6px;">
                    <button class="btn btn-outline-blue" id="addSupportBtn" style="padding: 8px 20px;">
                        <i class="fas fa-plus-circle"></i> 添加图片 (可多选)
                    </button>
                    <button class="btn" id="clearSupportBtn" style="padding: 8px 16px;">
                        <i class="fas fa-trash-alt"></i> 清空
                    </button>
                </div>
                <input type="file" id="supportFileInput" accept="image/*" multiple style="display:none;">
                <div id="supportPreviewContainer" class="image-grid"></div>
                <div style="font-size:0.85rem; color:#475569;">⚡ 按添加顺序对应类别1～N，每类K张</div>

                <!-- 查询图像区域 -->
                <div class="section-title" style="margin-top: 24px;">
                    <i class="fas fa-search"></i> 查询图像
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-outline-blue" id="selectQueryBtn">
                        <i class="fas fa-image"></i> 选择查询图像
                    </button>
                    <button class="btn" id="clearQueryBtn">
                        <i class="fas fa-times"></i> 清除
                    </button>
                </div>
                <input type="file" id="queryFileInput" accept="image/*" style="display:none;">
                <div id="queryPreviewContainer" class="image-grid" style="min-height: 90px;"></div>
            </div>

            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn btn-primary" id="predictBtn"><i class="fas fa-magic"></i> 开始预测</button>
                <button class="btn btn-outline-blue" id="sampleImagesBtn"><i class="fas fa-dice"></i> 获取示例</button>
            </div>

            <!-- 预测结果 -->
            <div id="predictionResultPanel" class="prediction-result" style="display: none;">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
                    <span style="font-weight:700; font-size:1.2rem;">🔮 预测类别</span>
                    <span id="predictedClassBadge" style="background:#2563eb; color:white; padding:6px 18px; border-radius:30px;"></span>
                </div>
                <div id="probabilitiesContainer"></div>
                <div id="predictErrorMsg" style="color:#b91c1c; margin-top:10px;"></div>
            </div>
            <div id="globalMessage" class="message-bar"><i class="far fa-bell"></i> 等待操作</div>
        </div>
    </div>
    <div class="footer-note">
        钱超屹 ml-task
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- 全局变量 ----------
        let lossChart, accChart;
        let pollingTimer = null;
        let isPolling = false;
        const API_BASE = window.location.origin;  // 使用当前域名

        // 图片存储
        let supportFiles = [];        // File[]
        let queryFile = null;

        // DOM 元素
        const nWayInput = document.getElementById('nWayInput');
        const kShotInput = document.getElementById('kShotInput');
        const epochsInput = document.getElementById('epochsInput');
        const startBtn = document.getElementById('startTrainBtn');
        const loadModelBtn = document.getElementById('loadModelBtn');
        const resetSystemBtn = document.getElementById('resetSystemBtn');
        const stopPollingBtn = document.getElementById('stopPollingBtn');
        const predictBtn = document.getElementById('predictBtn');
        const sampleBtn = document.getElementById('sampleImagesBtn');
        const supportHint = document.getElementById('supportHint');
        const supportCountDisplay = document.getElementById('supportCountDisplay');
        const supportPreview = document.getElementById('supportPreviewContainer');
        const queryPreview = document.getElementById('queryPreviewContainer');
        const trainingMsg = document.getElementById('trainingMessage');
        const epochDisplay = document.getElementById('epochDisplay');
        const epochProgress = document.getElementById('epochProgress');
        const trainLossVal = document.getElementById('trainLossVal');
        const trainAccVal = document.getElementById('trainAccVal');
        const valAccVal = document.getElementById('valAccVal');
        const modelStatusBadge = document.getElementById('model-status-badge');
        const predictionPanel = document.getElementById('predictionResultPanel');
        const predictedClassBadge = document.getElementById('predictedClassBadge');
        const probContainer = document.getElementById('probabilitiesContainer');
        const predictErrorMsg = document.getElementById('predictErrorMsg');
        const globalMsg = document.getElementById('globalMessage');
        const deviceSpan = document.getElementById('device-indicator');

        const addSupportBtn = document.getElementById('addSupportBtn');
        const clearSupportBtn = document.getElementById('clearSupportBtn');
        const selectQueryBtn = document.getElementById('selectQueryBtn');
        const clearQueryBtn = document.getElementById('clearQueryBtn');
        const supportFileInput = document.getElementById('supportFileInput');
        const queryFileInput = document.getElementById('queryFileInput');

        // 辅助函数
        function setMessage(msg, isError = false) {
            globalMsg.innerHTML = `<i class="far fa-${isError ? 'times-circle' : 'bell'}"></i> ${msg}`;
            globalMsg.style.background = isError ? '#fee2e2' : '#f1f5f9';
        }

        function updateSupportHintUI() {
            const n = parseInt(nWayInput.value) || 5;
            const k = parseInt(kShotInput.value) || 1;
            const req = n * k;
            supportHint.textContent = `需 ${req} 张 (${n}-way ${k}-shot)`;
            supportCountDisplay.textContent = `${supportFiles.length} / ${req} 张`;
            supportCountDisplay.style.background = supportFiles.length === req ? '#bbf7d0' : '#e2e8f0';
        }

        function renderSupportPreviews() {
            supportPreview.innerHTML = '';
            supportFiles.forEach((file, idx) => {
                const url = URL.createObjectURL(file);
                const wrap = document.createElement('div');
                wrap.className = 'thumb-wrapper';
                const img = document.createElement('img'); img.src = url; img.className = 'thumb';
                const del = document.createElement('button'); del.className = 'delete-btn'; del.innerHTML = '<i class="fas fa-times"></i>';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    supportFiles.splice(idx, 1);
                    renderSupportPreviews();
                    updateSupportHintUI();
                    setMessage(`已删除第 ${idx+1} 张支持图像`);
                });
                wrap.appendChild(img); wrap.appendChild(del);
                supportPreview.appendChild(wrap);
            });
            updateSupportHintUI();
        }

        function renderQueryPreview() {
            queryPreview.innerHTML = '';
            if (queryFile) {
                const url = URL.createObjectURL(queryFile);
                const wrap = document.createElement('div'); wrap.className = 'thumb-wrapper';
                const img = document.createElement('img'); img.src = url; img.className = 'thumb';
                const del = document.createElement('button'); del.className = 'delete-btn'; del.innerHTML = '<i class="fas fa-times"></i>';
                del.addEventListener('click', () => { queryFile = null; renderQueryPreview(); setMessage('查询图像已清除'); });
                wrap.appendChild(img); wrap.appendChild(del);
                queryPreview.appendChild(wrap);
            } else {
                queryPreview.innerHTML = '<div style="color:#94a3b8; padding:12px;">暂无查询图像</div>';
            }
        }

        // 事件绑定
        addSupportBtn.addEventListener('click', () => supportFileInput.click());
        supportFileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                supportFiles = supportFiles.concat(Array.from(e.target.files));
                renderSupportPreviews();
                setMessage(`已添加 ${e.target.files.length} 张，当前 ${supportFiles.length} 张`);
            }
            supportFileInput.value = '';
        });
        clearSupportBtn.addEventListener('click', () => { supportFiles = []; renderSupportPreviews(); setMessage('支持集已清空'); });
        selectQueryBtn.addEventListener('click', () => queryFileInput.click());
        queryFileInput.addEventListener('change', (e) => {
            if (e.target.files.length) { queryFile = e.target.files[0]; renderQueryPreview(); setMessage(`查询图像: ${queryFile.name}`); }
            queryFileInput.value = '';
        });
        clearQueryBtn.addEventListener('click', () => { queryFile = null; renderQueryPreview(); setMessage('查询图像已清除'); });
        nWayInput.addEventListener('input', updateSupportHintUI);
        kShotInput.addEventListener('input', updateSupportHintUI);
        updateSupportHintUI();

        // 图表初始化
        function initCharts() {
            const lossCtx = document.getElementById('lossChart').getContext('2d');
            const accCtx = document.getElementById('accChart').getContext('2d');

            lossChart = new Chart(lossCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '训练损失',
                        data: [],
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: '损失' } }
                    }
                }
            });

            accChart = new Chart(accCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '训练准确率',
                        data: [],
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            title: { display: true, text: '准确率 (%)' }
                        }
                    }
                }
            });
        }

        // 更新UI状态
        function updateStatusUI(data) {
            const train = data.is_training || false;
            trainingMsg.textContent = data.message || (train ? '训练中...' : '空闲');
            const cur = data.current_epoch || 0, total = data.total_epochs || 0;
            epochDisplay.textContent = `${cur}/${total}`;
            epochProgress.style.width = total ? (cur/total*100)+'%' : '0%';

            const lossArr = data.train_loss || [];
            const accArr = data.train_acc || [];
            trainLossVal.textContent = lossArr.length ? lossArr[lossArr.length-1].toFixed(4) : '-';
            trainAccVal.textContent = accArr.length ? (accArr[accArr.length-1]*100).toFixed(1)+'%' : '-';
            const valAcc = data.latest_val_acc || 0;
            valAccVal.textContent = valAcc != null ? (valAcc*100).toFixed(2)+'%' : '-';

            modelStatusBadge.textContent = valAcc > 0 ? `验证 ${(valAcc*100).toFixed(1)}%` : (train ? '训练中' : '待训练');
            modelStatusBadge.style.background = valAcc > 0.7 ? '#bbf7d0' : (train ? '#fef3c7' : '#e6edf6');
            deviceSpan.textContent = data.device || 'CPU';

            if (lossChart && accChart) {
                const epochs = lossArr.map((_,i)=> i+1);
                lossChart.data.labels = epochs;
                lossChart.data.datasets[0].data = lossArr;
                accChart.data.labels = epochs;
                accChart.data.datasets[0].data = accArr.map(v=>v*100);
                lossChart.update();
                accChart.update();
            }
            startBtn.disabled = train;
        }

        async function fetchStatus() {
            try {
                const r = await fetch(API_BASE + '/api/training_status');
                const d = await r.json();
                updateStatusUI(d);
                return d;
            } catch(e) {
                console.warn('状态获取失败:', e);
                setMessage('无法连接到服务器', true);
            }
        }

        function startPolling() {
            if (pollingTimer) clearInterval(pollingTimer);
            isPolling = true;
            stopPollingBtn.disabled = false;
            pollingTimer = setInterval(() => fetchStatus(), 1200);
            fetchStatus();
        }

        function stopPolling() {
            if (pollingTimer) clearInterval(pollingTimer);
            pollingTimer = null;
            isPolling = false;
            stopPollingBtn.disabled = true;
        }
        stopPollingBtn.addEventListener('click', stopPolling);

        // 训练
        startBtn.addEventListener('click', async () => {
            const n = parseInt(nWayInput.value) || 5;
            const k = parseInt(kShotInput.value) || 1;
            const e = parseInt(epochsInput.value) || 10;

            try {
                setMessage('启动训练中...');
                const r = await fetch(API_BASE + '/api/train', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ n_way: n, k_shot: k, epochs: e })
                });
                const d = await r.json();
                if (d.status === 'success') {
                    setMessage('训练已启动');
                    startPolling();
                }
                else setMessage(d.message||'启动失败', true);
            } catch(e) {
                setMessage('网络错误: ' + e.message, true);
            }
        });

        loadModelBtn.addEventListener('click', async () => {
            try {
                setMessage('加载模型中...');
                const r = await fetch(API_BASE + '/api/load_model', { method: 'POST' });
                const d = await r.json();
                setMessage(d.message, d.status!=='success');
                if (d.status==='success') {
                    fetchStatus();
                    if(!isPolling) startPolling();
                }
            } catch(e) {
                setMessage('加载失败: ' + e.message, true);
            }
        });

        resetSystemBtn.addEventListener('click', async () => {
            if(!confirm('重置系统将清空状态，确定吗？')) return;
            try {
                setMessage('重置系统中...');
                await fetch(API_BASE + '/api/reset', { method: 'POST' });
                setMessage('系统已重置');
                fetchStatus();
                supportFiles=[];
                queryFile=null;
                renderSupportPreviews();
                renderQueryPreview();
            } catch(e) {
                setMessage('重置失败: ' + e.message, true);
            }
        });

        // 预测
        predictBtn.addEventListener('click', async () => {
            const n = parseInt(nWayInput.value) || 5;
            const k = parseInt(kShotInput.value) || 1;
            const required = n * k;

            if (supportFiles.length !== required) {
                setMessage(`需要 ${required} 张支持图像 (当前: ${supportFiles.length} 张)`, true);
                return;
            }

            if (!queryFile) {
                setMessage('请选择查询图像', true);
                return;
            }

            setMessage('预测中...');
            predictionPanel.style.display = 'none';
            predictErrorMsg.textContent = '';

            // 将图片转换为base64
            const readFile = (file) => new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });

            try {
                const supportB64 = await Promise.all(supportFiles.map(f => readFile(f)));
                const queryB64 = await readFile(queryFile);

                const response = await fetch(API_BASE + '/api/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        n_way: n,
                        k_shot: k,
                        support_images: supportB64,
                        query_image: queryB64
                    })
                });

                const data = await response.json();
                if (data.status === 'success') {
                    const res = data.result;
                    predictedClassBadge.textContent = `${res.predicted_class_name}  (置信度 ${res.confidence_percentage})`;

                    // 渲染各类别置信度进度条
                    let probHtml = '';
                    if (res.probabilities && res.probabilities.length) {
                        res.probabilities.forEach(p => {
                            const percent = (p.probability * 100).toFixed(2);
                            probHtml += `
                                <div class="prob-item">
                                    <div class="prob-header">
                                        <span>${p.class}</span>
                                        <span>${p.percentage || percent + '%'}</span>
                                    </div>
                                    <div class="prob-bar-bg">
                                        <div class="prob-bar-fill" style="width: ${percent}%;"></div>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        probHtml = `<div>置信度: ${res.confidence_percentage}</div>`;
                    }
                    probContainer.innerHTML = probHtml;
                    predictionPanel.style.display = 'block';
                    setMessage(`预测完成: ${res.predicted_class_name} (置信度: ${res.confidence_percentage})`);
                } else {
                    predictErrorMsg.textContent = data.message || '预测失败';
                    predictionPanel.style.display = 'block';
                    setMessage(data.message || '预测失败', true);
                }
            } catch(e) {
                setMessage('请求失败: ' + e.message, true);
            }
        });

        sampleBtn.addEventListener('click', async () => {
            try {
                const r = await fetch(API_BASE + '/api/sample_images');
                const d = await r.json();
                if (d.status==='success') {
                    setMessage(`获取到 ${d.images.length} 张样本图像`);
                } else {
                    setMessage(d.message || '获取失败', true);
                }
            } catch(e) {
                setMessage('获取示例失败: ' + e.message, true);
            }
        });

        // 初始化
        initCharts();
        fetchStatus().then(d => {
            if(d && d.is_training) startPolling();
        });
        renderSupportPreviews();
        renderQueryPreview();
        window.addEventListener('beforeunload', () => stopPolling());
    })();
</script>
</body>
</html>
